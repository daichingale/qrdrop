[package]
name = "qrdrop_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.100"
qrcodegen = "1.8"
rqrr = "0.9"
blake3 = { version = "1", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
